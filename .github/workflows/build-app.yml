name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm packaging/app.spec

      - name: Test and zip (Mac)
        if: runner.os == 'macOS'
        run: |
          LOG="$HOME/Library/Application Support/Medical Paperwork Translator/log.txt"
          "dist/Medical Paperwork Translator.app/Contents/MacOS/Medical Paperwork Translator" --self-test || { cat "$LOG"; exit 1; }
          cat "$LOG"
          ditto -c -k --keepParent "dist/Medical Paperwork Translator.app" Medical-Paperwork-Translator-Mac.zip

      - name: Test and zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/Medical Paperwork Translator/Medical Paperwork Translator.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:APPDATA/Medical Paperwork Translator/log.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
          Compress-Archive -Path "dist/Medical Paperwork Translator" -DestinationPath Medical-Paperwork-Translator-Windows.zip

      - name: Open the window once (Mac)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          "dist/Medical Paperwork Translator.app/Contents/MacOS/Medical Paperwork Translator" --smoke-test-window
          status=$?; cat "$HOME/Library/Application Support/Medical Paperwork Translator/log.txt"; exit $status

      - name: Open the window once (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Medical Paperwork Translator/Medical Paperwork Translator.exe" -ArgumentList "--smoke-test-window" -Wait -PassThru
          Get-Content "$env:APPDATA/Medical Paperwork Translator/log.txt"
          exit $p.ExitCode

      - name: Publish to the Releases page
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Medical Paperwork Translator $GITHUB_REF_NAME" --notes-file packaging/release-notes.md \
            || sleep 10
          gh release upload "$GITHUB_REF_NAME" Medical-Paperwork-Translator-*.zip --clobber
